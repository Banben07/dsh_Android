name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Set up matching Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test, lint and build native APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: harness-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: harness-debug-apk
          path: apk
      - name: Publish installable development APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_TAG: build-${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          gh release create "$BUILD_TAG" apk/app-debug.apk \
            --target "$BUILD_SHA" --prerelease \
            --title "DeepSeek Harness · build ${{ github.run_number }}" \
            --notes "Native Android development build. Requires Android 8.0+ and a reachable DeepSeek harness HTTP/HTTPS server. Includes native file uploads, slash commands, tool history folding, completion notifications and connection diagnostics. Protocol/UI tests and Android lint must pass before publication."
